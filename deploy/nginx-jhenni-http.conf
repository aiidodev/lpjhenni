# /etc/nginx/sites-available/jhenni
# Proxy para Next (PM2) na porta 3000.
#
# DNS: um único registo A para jhenni.com.br → IP do VPS. Evite dois A para IPs
# diferentes (metade dos visitantes cai no servidor errado).
#
# Depois de colocar este ficheiro:
#   sudo ln -sf /etc/nginx/sites-available/jhenni /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jhenni.com.br -d www.jhenni.com.br
#
# Ou use o script: sudo bash deploy/setup-jhenni-domain.sh

server {
    listen 80;
    listen [::]:80;
    server_name jhenni.com.br www.jhenni.com.br;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
