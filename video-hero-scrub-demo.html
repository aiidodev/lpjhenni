<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Futuro da Automação — Video Scrub Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .video-hero {
        position: relative;
        height: 400vh;
        width: 100%;
      }

      .video-hero > video {
        position: sticky;
        top: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 0;
      }

      .overlay-text {
        position: sticky;
        top: 0;
        z-index: 2;
        margin-top: -100vh;
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(1.25rem, 4vw, 3rem);
        pointer-events: none;
      }

      .overlay-text::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          to bottom,
          rgba(10, 10, 10, 0.28) 0%,
          rgba(10, 10, 10, 0.5) 40%,
          rgba(10, 10, 10, 0.82) 100%
        );
      }

      .overlay-text h1 {
        position: relative;
        margin: 0;
        max-width: 14ch;
        font-size: clamp(2.25rem, 7vw, 4.75rem);
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1.02;
        text-align: center;
        text-wrap: balance;
        color: #fafafa;
        text-shadow: 0 2px 40px rgba(0, 0, 0, 0.5);
      }

      .after-hero {
        min-height: 100vh;
        padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 4rem);
        max-width: 42rem;
        margin: 0 auto;
      }

      .after-hero p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.75;
        color: var(--muted);
      }

      .after-hero code {
        font-size: 0.9em;
        color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <div class="video-hero" id="videoHero">
      <video id="scrubVideo" muted playsinline preload="auto"></video>
      <div class="overlay-text">
        <h1 id="heroTitle">O Futuro da Automação</h1>
      </div>
    </div>

    <section class="after-hero" aria-label="Conteúdo seguinte">
      <p>
        Coloque este ficheiro na mesma pasta do MP4 ou altere <code>VIDEO_SRC</code> no script. Para testar sem
        servidor local, alguns browsers bloqueiam vídeo em <code>file://</code> — use
        <code>npx serve .</code> ou abra via Live Server.
      </p>
    </section>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const video = document.getElementById("scrubVideo");
      const container = document.getElementById("videoHero");
      const title = document.getElementById("heroTitle");

      const VIDEO_SRC =
        "Cria%C3%A7%C3%A3o_de_Landing_Page_com_Video_Scrubbing.mp4";

      let initialized = false;

      video.pause();
      video.src = VIDEO_SRC;
      video.removeAttribute("loop");

      function bindScrub() {
        if (initialized) return;
        const d = video.duration;
        if (!d || !Number.isFinite(d)) return;

        initialized = true;

        ScrollTrigger.create({
          trigger: container,
          start: "top top",
          end: "bottom bottom",
          scrub: 1.5,
          onUpdate: (self) => {
            video.currentTime = self.progress * d;
          },
        });

        gsap.fromTo(
          title,
          { opacity: 1, scale: 1 },
          {
            opacity: 0,
            scale: 1.14,
            ease: "power2.out",
            scrollTrigger: {
              trigger: container,
              start: "top top",
              end: "top -35%",
              scrub: 1.5,
            },
          },
        );

        ScrollTrigger.refresh();
      }

      function onLoadedMetadata() {
        video.pause();
        bindScrub();
      }

      video.addEventListener("loadedmetadata", onLoadedMetadata, { once: true });

      if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
        onLoadedMetadata();
      }

      video.addEventListener("error", () => {
        console.warn(
          "Falha ao carregar o vídeo. Verifique VIDEO_SRC e use um servidor HTTP local se necessário.",
        );
      });
    </script>
  </body>
</html>
